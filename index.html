<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TuPeek · 3D House</title>
  <meta name="description" content="Interactive 3D model of the house, room by room.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%2341566b'/%3E%3Crect x='13' y='19' width='6' height='8' fill='%23f1efe9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <div id="loading">Building the room…</div>

  <header id="hud" class="panel">
    <div class="hud-head">
      <span class="brand">TuPeek</span>
      <select id="room-select" aria-label="Room"></select>
      <button id="hud-toggle" class="icon" aria-label="Show or hide controls">☰</button>
    </div>
    <div class="hud-body">
      <div class="btn-row">
        <button data-view="overview">Overview</button>
        <button data-view="eye">Eye level</button>
        <button data-view="top">Top down</button>
        <button id="walk-btn">Walk</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="t-dims" checked> Measurements</label>
        <label><input type="checkbox" id="t-cutaway" checked> Cut away walls</label>
        <label><input type="checkbox" id="t-ceiling" checked> Ceiling</label>
      </div>
      <p class="hint orbit-hint">Drag to orbit · right-drag or two fingers to pan · scroll or pinch to zoom · click anything for its size.</p>
      <p class="hint walk-hint">Drag to look · W A S D or arrow keys to move (Shift = faster) · Esc to leave.</p>
    </div>
  </header>

  <aside id="info" class="panel" hidden>
    <div class="info-head">
      <strong id="info-title"></strong>
      <button id="info-close" class="icon" aria-label="Close">×</button>
    </div>
    <div id="info-body"></div>
    <p class="hint">All sizes in inches. To change something, reference its ID, e.g. “make B3 30″ wide”.</p>
  </aside>

  <div id="walk-pad" aria-hidden="true">
    <button data-key="w" class="up">▲</button>
    <button data-key="a" class="left">◀</button>
    <button data-key="s" class="down">▼</button>
    <button data-key="d" class="right">▶</button>
  </div>

  <script>
    // sw.js makes every request skip the browser cache
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
